{% extends 'lms/base.html' %}

{% block title %}
Sign In - Sematec LMS
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Welcome Back
                            </h2>

                            <p class="text-secondary">
                                Sign in to continue your learning journey.
                            </p>

                        </div>


                        {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                        {% endif %}


                        <form method="POST">

                            {% csrf_token %}


                            <!-- Username -->

                            <div class="mb-3">

                                <label
                                        for="username"
                                        class="form-label fw-semibold">

                                    Username

                                </label>

                                <input
                                        type="text"
                                        name="username"
                                        id="username"
                                        class="form-control"
                                        placeholder="Enter your username"
                                        required>

                            </div>


                            <!-- Password -->

                            <div class="mb-4">

                                <label
                                        for="password"
                                        class="form-label fw-semibold">

                                    Password

                                </label>

                                <input
                                        type="password"
                                        name="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Enter your password"
                                        required>

                            </div>


                            <!-- Submit -->

                            <button
                                    type="submit"
                                    class="btn btn-primary w-100">

                                Sign In

                            </button>

                        </form>


                        <div class="text-center mt-4">

                            <p class="text-secondary mb-0">

                                Don't have an account?

                                <a
                                        href="{% url 'signup' %}"
                                        class="text-decoration-none fw-semibold">

                                    Sign Up

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
